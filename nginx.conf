upstream hsh_rust_backend {
    server rust-backend:3000;
    keepalive 16;
}

# WebSocket 升级用。比无脑写死 Connection "upgrade" 正确：
# 普通 REST 请求会得到 Connection: close，不会把 upstream 的 keepalive 连接搞坏。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 通用片段：静态资源 + API 反代 + SPA fallback
# 同时被 HTTP / HTTPS server 复用，避免重复定义。
# 注意：HSTS 等「只 HTTPS 才合理」的 header 放在 HTTPS server 里 add_header，
#      不要在这个片段里，避免 HTTP 也带 HSTS 让用户被强制 HTTPS 锁住。
# HTTP 块：备案完成后强制 HTTPS，所有 :80 请求 301 到 https://hsh-erp.cloud
# - 静态资源 / API 反代 / SPA fallback 全部由 HTTPS server 块承担，HTTP 这里只剩重定向。
# - 用 $request_uri 而不是 $uri$is_args$args：保证 query string 也一并带过去。
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    return 301 ${NGINX_REDIRECT_TARGET}$request_uri;
}

# HTTPS 主服务：备案通过 + SSL 证书上传到 CVM 后启用。
# 当前 docker-compose.yml 没有 bind mount 443 端口和 SSL 证书文件，
# 这个 server 块暂不生效；备案通过后再：
#   1) 把 cert / key scp 到 CVM: /home/ubuntu/hsh-erp/ssl/
#   2) 在 docker-compose.yml 取消注释 443:443 + 两行 SSL bind mount
#   3) 重启 frontend: docker compose --env-file .env.production restart frontend
# >>> SSL_BLOCK_START <<<
server {
    listen 443 ssl;
    http2 on;
    server_name ${NGINX_SERVER_NAME};

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/${SSL_CRT_FILENAME};
    ssl_certificate_key /etc/nginx/ssl/${SSL_KEY_FILENAME};

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # gzip（与 HTTP 块保持一致）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml font/ttf;
    gzip_min_length 1024;

    # 安全 headers（HTTPS 多一条 HSTS）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # pdfjs cMap（2026-10-03 新增）：中文 / 日文 PDF 渲染必需。pdfjs 不查任何
    # manifest，按 `cMapUrl + <name>.bcmap` 自行拼 URL，所以这些文件必须是无 hash 的
    # 原名产出（由 scripts/pdfjsCmapsPlugin.ts 的 emitFile 落到 dist/cmaps/）。
    #
    # 必须显式声明，不能靠下面 `location /` 的 try_files：缺了不存在的 cMap 会被回退成
    # 200 + index.html，pdfjs 拿到 HTML 喂 BinaryCMapReader 会抛
    # "BinaryCMapReader.process: Invalid dataSize."，且日志里看不出是 nginx 兜底。
    # `^~` 不可省：命中后不再考虑正则 location。
    #
    # 缓存 1h + 不加 immutable：与下方 .mjs 块同一取舍 —— 文件名无 hash、内容随
    # pdfjs-dist 版本变，加 immutable 会让客户端把旧 cMap 按年复用，1h 后浏览器
    # 自动 revalidate 即可拿到新文件。
    # ⚠️ 改这里同步检查 nginx.http-only.conf。
    location ^~ /cmaps/ {
        expires 1h;
        try_files $uri =404;
    }

    # pdfjs worker 等 .mjs 模块脚本：显式声明 JS MIME。
    # 基础镜像 mime.types 缺失 mjs 映射时会被当作 application/octet-stream，
    # 浏览器「Strict MIME type checking for module scripts」拒绝作为 module 加载
    # （pdf 预览退化到主线程 fake worker）。正则 location 优先级高于 /assets/ 前缀，
    # 覆盖 /assets/ 下的 pdf.worker.min-*.mjs。
    #
    # 缓存 1h + 不强制 immutable：default_type 已声明 JS MIME，未来如再次 MIME 错配
    # 1 小时内浏览器自动 revalidate 拿到正确响应（nginx 不会因 expires + add_header
    # 双 Cache-Control 字段而长期保留旧的 octet-stream）。
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1h;
        try_files $uri =404;
    }

    # ========================================================
    # MCP 只读入口——公网一律拒绝（2026-08-08 新增）
    # ========================================================
    # `/api/mcp/*`（REST 查询）与 `/mcp`（MCP 协议端点）在应用层**没有任何鉴权**：
    # 它们是给内网 AI 助手用的免登录只读入口，安全性完全由这里 + 云上安全组保证。
    #
    # ⚠️ 三个 nginx 匹配细节，改这段前务必理解：
    # 1. `^~` 不能省。普通前缀 location 会被上面的正则 `~* \.mjs$` 抢走
    #    ——`/api/mcp/x.mjs` 就会绕过 deny 落到 try_files。`^~` 命中后直接停止
    #    匹配，不再考虑正则。
    # 2. `^~ /api/mcp` **不带**尾斜杠：带尾斜杠的话 `/api/mcp`（无斜杠）不匹配，
    #    会落到下面的 SPA fallback（返回 index.html），拿不到 403。
    # 3. `= /mcp` 精确匹配 + `^~ /mcp/` 前缀：只挡 MCP 端点本身，不会误伤将来
    #    前端加的 `/mcp-xxx` 之类 SPA 路由（纯前缀 `/mcp` 会把它们一起 403）。
    #
    # 要放开给内网访问时：把 `deny all` 换成 `allow <内网网段>; deny all;`
    # 并补上与 `location ^~ /api/v2/` 相同的 proxy_pass 配置，**不要**直接删掉本段。
    location ^~ /api/mcp {
        deny all;
    }

    location = /mcp {
        deny all;
    }

    location ^~ /mcp/ {
        deny all;
    }

    # 后端 API 反代（Rust Axum v2 走 rust-backend:3000）
    # ^~ 不可省：与 nginx.http-only.conf 同样原因（防止 /api/v2/x.mjs 被 ~* \.mjs$
    # 正则抢走落 try_files 404）。⚠️ 改这里同步检查 nginx.http-only.conf。
    location ^~ /api/v2/ {
        client_max_body_size    300m;
        client_body_buffer_size 1m;
        client_body_timeout     600s;

        proxy_pass         http://hsh_rust_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # WebSocket 中枢（/ws/dashboard 等）走 rust-backend。
    location ^~ /ws/ {
        proxy_pass         http://hsh_rust_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # 2026-10-03：前端全部走 /api/v2 → rust；Python 仅在 compose 内网经 rust 转发
    # 触达，不再经 nginx 对外暴露（原 `location /api/` → backend:8000 已删）。
    # `/api/` 下的未知路径现在落到下方 SPA fallback（静态资源 → index.html），
    # 不会被反代到 Python。

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# <<< SSL_BLOCK_END <<<
