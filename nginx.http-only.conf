# HTTP-only 配置：SSL 证书缺失时由 entrypoint.sh 覆盖到 /etc/nginx/conf.d/default.conf。
#
# 背景：nginx.conf（HTTPS 版）的 :80 server 只 301 到 https://hsh-erp.cloud，
# 所有内容 location 都在 SSL 块内；证书缺失时旧 entrypoint 删掉 SSL 块后
# 只剩 301，本地 / 未备案环境完全无法访问。本文件提供纯 HTTP 完整服务，
# 与 nginx.conf 的 HTTPS server 块内容保持一致（除 SSL/HSTS 相关项）。
# ⚠️ 改这里时同步检查 nginx.conf HTTPS 块的对应 location，避免两处漂移。

upstream hsh_rust_backend {
    server rust-backend:3000;
    keepalive 16;
}

# WebSocket 升级用。比无脑写死 Connection "upgrade" 正确：
# 普通 REST 请求会得到 Connection: close，不会把 upstream 的 keepalive 连接搞坏。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # server_name 由 NGINX_SERVER_NAME 注入；测试服务器设 _（通配），生产设 hsh-erp.cloud。
    # envsubst 不支持 ${VAR:-default} 语法，默认值兜底交给 docker-compose.yml 的
    # ${NGINX_SERVER_NAME:-...} 处理。
    server_name ${NGINX_SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml font/ttf;
    gzip_min_length 1024;

    # 安全 headers（不含 HSTS——HTTP 下带 HSTS 会把浏览器强制锁到 HTTPS）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # pdfjs cMap（2026-10-03 新增）：中文 / 日文 PDF 渲染必需。pdfjs 不查任何
    # manifest，按 `cMapUrl + <name>.bcmap` 自行拼 URL，所以这些文件必须是无 hash 的
    # 原名产出（由 scripts/pdfjsCmapsPlugin.ts 的 emitFile 落到 dist/cmaps/）。
    #
    # 必须显式声明，不能靠下面 `location /` 的 try_files：缺了不存在的 cMap 会被回退成
    # 200 + index.html，pdfjs 拿到 HTML 喂 BinaryCMapReader 会抛
    # "BinaryCMapReader.process: Invalid dataSize."，且日志里看不出是 nginx 兜底。
    # `^~` 不可省：命中后不再考虑正则 location。
    #
    # 缓存 1h + 不加 immutable：与下方 .mjs 块同一取舍 —— 文件名无 hash、内容随
    # pdfjs-dist 版本变，加 immutable 会让客户端把旧 cMap 按年复用，1h 后浏览器
    # 自动 revalidate 即可拿到新文件。
    # ⚠️ 改这里同步检查 nginx.conf 的 HTTPS server 块（nginx.http-only.conf:7 已声明）。
    location ^~ /cmaps/ {
        expires 1h;
        try_files $uri =404;
    }

    # pdfjs worker 等 .mjs 模块脚本：显式声明 JS MIME。
    # 基础镜像 mime.types 缺失 mjs 映射时会被当作 application/octet-stream，
    # 浏览器「Strict MIME type checking for module scripts」拒绝作为 module 加载
    # （pdf 预览退化到主线程 fake worker）。正则 location 优先级高于 /assets/ 前缀，
    # 覆盖 /assets/ 下的 pdf.worker.min-*.mjs。
    #
    # 缓存 1h + 不强制 immutable：default_type 已声明 JS MIME，未来如再次 MIME 错配
    # 1 小时内浏览器自动 revalidate 拿到正确响应。
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1h;
        try_files $uri =404;
    }

    # 后端 API 反代（Rust Axum v2 走 rust-backend:3000）
    # ^~ 不可省：否则上面的 ~* \.mjs$ 正则会抢走普通前缀 /api/v2/，
    # 让 /api/v2/x.mjs 落到 try_files 返回 404。nginx 最长前缀优先。
    location ^~ /api/v2/ {
        client_max_body_size    300m;
        client_body_buffer_size 1m;
        client_body_timeout     600s;

        proxy_pass         http://hsh_rust_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # WebSocket 中枢（/ws/dashboard 等）走 rust-backend。
    # 同样 ^~，防止被正则 ~* \.mjs$ 抢走。
    location ^~ /ws/ {
        proxy_pass         http://hsh_rust_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # 2026-10-03：前端全部走 /api/v2 → rust；Python 仅在 compose 内网经 rust 转发
    # 触达，不再经 nginx 对外暴露（原 `location /api/` → backend:8000 已删）。
    # `/api/` 下的未知路径现在落到下方 SPA fallback（静态资源 → index.html），
    # 不会被反代到 Python。
    # ⚠️ 与 nginx.conf 的 HTTPS server 保持同步（nginx.http-only.conf:7 已声明）。

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
